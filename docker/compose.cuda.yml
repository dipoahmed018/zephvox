# NVIDIA GPUs (needs the NVIDIA Container Toolkit). Use with compose.yml, see there.
services:
  zephvox:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
