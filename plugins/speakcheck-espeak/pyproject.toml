[project]
name = "speakcheck-espeak"
version = "0.1.0"
description = "espeak-ng pronunciations (any word, US or UK) for speakcheck"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "dipoahmed018", email = "dipoahmed018@gmail.com" }]
requires-python = ">=3.12,<3.14"
# speakcheck itself is not listed: this plugin is only ever loaded by an installed speakcheck.
dependencies = [
    "phonemizer>=3.3",
    # espeak-ng library + data as a wheel (Linux, Windows, macOS): no system install needed.
    "espeakng-loader>=0.2.4",
]

[project.entry-points."speakcheck.g2p"]
espeak = "speakcheck_espeak:EspeakG2P"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakcheck_espeak"]
