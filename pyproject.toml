[project]
name = "speakcheck"
version = "0.1.0"
description = "Pluggable engine that finds pronunciation and grammar mistakes in your spoken English"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "cmudict>=1.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Heavy model runtimes are optional so the engine core (and unit tests) stay light.
# `models` needs exactly one PyTorch build next to it: `cpu`, `cuda` or `rocm`.
models = [
    "transformers>=4.56",
    "faster-whisper>=1.1",
    "phonemizer>=3.3",
    # espeak-ng library + data as a wheel (Linux, Windows, macOS): no system install needed.
    "espeakng-loader>=0.2.4",
    # ffmpeg's libraries as a wheel, to read any audio file (also needed by faster-whisper).
    "av>=12",
]

# PyTorch builds (pick one). `cpu` is also the right one on macOS: it uses the Apple GPU (MPS).
cpu = ["torch>=2.6"]
cuda = ["torch>=2.6"]  # NVIDIA, Linux and Windows
rocm = [
    "torch>=2.6",
    # Companion of the ROCm torch build; listed so it can be pinned to the PyTorch index.
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Cross-platform microphone capture and global shortcuts.
desktop = [
    "sounddevice>=0.5",
    "pynput>=1.7",
    "dbus-fast>=2.0; sys_platform == 'linux'",
]
# Natural reference voices for practice.
voice = [
    "kokoro>=0.9",
    # spaCy model Kokoro's text front end needs; it would otherwise try to pip-install it at runtime.
    "en-core-web-sm>=3.8",
]
# Local daemon + web GUI (`speakcheck serve`).
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
speakcheck = "speakcheck.cli:main"

# Built-in plugins are registered exactly like third-party ones.
[project.entry-points."speakcheck.capture"]
pipewire = "speakcheck.providers.capture.pipewire:PipeWireCapture"
sounddevice = "speakcheck.providers.capture.sounddevice:SoundDeviceCapture"

[project.entry-points."speakcheck.tts"]
kokoro = "speakcheck.providers.tts.kokoro:KokoroTTS"
espeak-ng = "speakcheck.providers.tts.espeak:EspeakTTS"

[project.entry-points."speakcheck.triggers"]
portal = "speakcheck.providers.triggers.portal:PortalTriggers"
pynput = "speakcheck.providers.triggers.pynput:PynputTriggers"

[project.entry-points."speakcheck.stt"]
hf-whisper = "speakcheck.providers.stt.hf_whisper:HFWhisperSTT"
faster-whisper = "speakcheck.providers.stt.faster_whisper:FasterWhisperSTT"

[project.entry-points."speakcheck.g2p"]
cmudict = "speakcheck.providers.g2p.cmudict:CMUDictG2P"
espeak = "speakcheck.providers.g2p.espeak:EspeakG2P"
chain = "speakcheck.providers.g2p.chain:ChainG2P"

[project.entry-points."speakcheck.phonemes"]
wav2vec2 = "speakcheck.providers.phonemes.wav2vec2:Wav2Vec2PhonemeRecognizer"

[project.entry-points."speakcheck.llm"]
openai-compat = "speakcheck.providers.llm.openai_compat:OpenAICompatLLM"

[project.entry-points."speakcheck.analyzers"]
pronunciation = "speakcheck.analyzers.pronunciation.analyzer:PronunciationAnalyzer"
grammar = "speakcheck.analyzers.grammar.analyzer:GrammarAnalyzer"
practice = "speakcheck.analyzers.pronunciation.practice:PracticeAnalyzer"

[project.entry-points."speakcheck.reporters"]
terminal = "speakcheck.reporters.terminal:TerminalReporter"
markdown = "speakcheck.reporters.markdown:MarkdownReporter"
json = "speakcheck.reporters.json:JsonReporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakcheck"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
# macOS takes torch from PyPI (its only build, with Apple GPU support).
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not models and not gpu and not llm and not audio'"
markers = [
    "models: needs downloaded speech models (Whisper, wav2vec2)",
    "gpu: needs a working ROCm/CUDA GPU",
    "llm: needs a running Ollama (or other OpenAI-compatible) server",
    "audio: needs espeak-ng to synthesize fixture audio",
]

[tool.coverage.run]
source = ["speakcheck"]
omit = [
    # Thin wrappers around heavy model runtimes; covered by the opt-in integration suite.
    "*/providers/stt/*",
    "*/providers/phonemes/*",
    "*/providers/g2p/espeak.py",
    "*/providers/tts/kokoro.py",
]
