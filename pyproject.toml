[project]
name = "zephvox"
version = "0.1.0"
description = "Pluggable engine that finds pronunciation and grammar mistakes in your spoken English"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "dipoahmed018", email = "dipoahmed018@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic>=2.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Heavy model runtimes are optional so the engine core (and unit tests) stay light.
# `models` needs exactly one PyTorch build next to it: `cpu`, `cuda` or `rocm`.
models = [
    "transformers>=4.56",
    "faster-whisper>=1.1",
    "safetensors>=0.4",
    # US and UK pronunciation dictionaries (also Kokoro's text front end).
    "misaki>=0.9.4",
    # ffmpeg's libraries as a wheel, to read any audio file (also needed by faster-whisper).
    "av>=12",
]

# PyTorch builds (pick one). `cpu` is also the right one on macOS: it uses the Apple GPU (MPS).
cpu = ["torch>=2.6"]
cuda = ["torch>=2.6"]  # NVIDIA, Linux and Windows
rocm = [
    "torch>=2.6",
    # Companion of the ROCm torch build; listed so it can be pinned to the PyTorch index.
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# Cross-platform microphone capture and global shortcuts.
desktop = [
    "sounddevice>=0.5",
    "pynput>=1.7",
    "dbus-fast>=2.0; sys_platform == 'linux'",
]
# Natural reference voices for practice.
voice = [
    "kokoro>=0.9",
    # What misaki[en] would bring, minus its GPL espeak fallback (see override-dependencies).
    "num2words>=0.5",
    "spacy>=3.8",
    # Kokoro imports `attr` without declaring it (phonemizer used to bring it in).
    "attrs>=23",
    # spaCy model Kokoro's text front end needs; it would otherwise try to pip-install it at runtime.
    "en-core-web-sm>=3.8",
]
# Optional GPL plugin: espeak-ng pronunciations (plugins/zephvox-espeak, a separate package).
espeak = ["zephvox-espeak"]
# Local daemon + web GUI, and `zephvox server serve` (websockets: practice streaming).
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "websockets>=13"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
zephvox = "zephvox.cli:main"

# Built-in plugins are registered exactly like third-party ones.
[project.entry-points."zephvox.capture"]
pipewire = "zephvox.providers.capture.pipewire:PipeWireCapture"
sounddevice = "zephvox.providers.capture.sounddevice:SoundDeviceCapture"

[project.entry-points."zephvox.tts"]
kokoro = "zephvox.providers.tts.kokoro:KokoroTTS"
espeak-ng = "zephvox.providers.tts.espeak:EspeakTTS"

[project.entry-points."zephvox.triggers"]
portal = "zephvox.providers.triggers.portal:PortalTriggers"
pynput = "zephvox.providers.triggers.pynput:PynputTriggers"

[project.entry-points."zephvox.stt"]
hf-whisper = "zephvox.providers.stt.hf_whisper:HFWhisperSTT"
faster-whisper = "zephvox.providers.stt.faster_whisper:FasterWhisperSTT"

[project.entry-points."zephvox.g2p"]
cmudict = "zephvox.providers.g2p.cmudict:CMUDictG2P"
misaki = "zephvox.providers.g2p.misaki:MisakiG2P"
deep-phonemizer = "zephvox.providers.g2p.deep_phonemizer:DeepPhonemizerG2P"
chain = "zephvox.providers.g2p.chain:ChainG2P"

[project.entry-points."zephvox.phonemes"]
wav2vec2 = "zephvox.providers.phonemes.wav2vec2:Wav2Vec2PhonemeRecognizer"

[project.entry-points."zephvox.llm"]
openai-compat = "zephvox.providers.llm.openai_compat:OpenAICompatLLM"

[project.entry-points."zephvox.analyzers"]
pronunciation = "zephvox.analyzers.pronunciation.analyzer:PronunciationAnalyzer"
grammar = "zephvox.analyzers.grammar.analyzer:GrammarAnalyzer"
practice = "zephvox.analyzers.pronunciation.practice:PracticeAnalyzer"

[project.entry-points."zephvox.reporters"]
terminal = "zephvox.reporters.terminal:TerminalReporter"
markdown = "zephvox.reporters.markdown:MarkdownReporter"
json = "zephvox.reporters.json:JsonReporter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zephvox"]

[tool.uv]
default-groups = ["dev"]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "rocm" }]]
# Kokoro asks for misaki[en], whose espeak fallback is GPL. zephvox supplies its own fallback
# (deep-phonemizer), so install plain misaki and keep the default install free of GPL code.
override-dependencies = ["misaki>=0.9.4"]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
zephvox-espeak = { path = "plugins/zephvox-espeak" }
# macOS takes torch from PyPI (its only build, with Apple GPU support).
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not models and not gpu and not llm and not audio'"
markers = [
    "models: needs downloaded speech models (Whisper, wav2vec2)",
    "gpu: needs a working ROCm/CUDA GPU",
    "llm: needs a running Ollama (or other OpenAI-compatible) server",
    "audio: needs espeak-ng to synthesize fixture audio",
]

[tool.coverage.run]
source = ["zephvox"]
omit = [
    # Thin wrappers around heavy model runtimes; covered by the opt-in integration suite.
    "*/providers/stt/*",
    "*/providers/phonemes/*",
    "*/providers/g2p/_deep_phonemizer.py",
    "*/providers/tts/kokoro.py",
]
