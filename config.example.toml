# speakcheck configuration.
#
#   cp config.example.toml config.toml
#
# config.toml is git-ignored, so your local choices are never committed. Everything below is
# commented out and shows the default: uncomment only what you want to change.
#
# `speakcheck setup` writes the chosen profile on the first line: large, standard, small, cpu, cpu-light,
# or custom (your own answers to setup's questions, saved in custom-profile.toml next to this file).
# A profile changes some of the defaults below (model sizes, CPU vs GPU); anything you set here wins.
# Secrets and machine-specific environment variables go in .env (see .env.example).
# Choices made in the web GUI (microphone, voice, analyzers) are saved separately and win over this file.

[engine]
# analyzers = ["pronunciation", "grammar"]
# data_dir = "~/.local/share/speakcheck"   # sessions and recordings (default: your OS's app-data folder)
# sentence_split = true
# practice_auto_stop_s = 1.2               # practice stops after this much silence (0 = manual stop only)
# practice_max_s = 10.0

# Drivers for each stage, in order of preference: the first available one is used.
# Run `uv run speakcheck providers` to see which are available and why the others are not.
[providers]
# capture = ["pipewire", "sounddevice"]    # Windows/macOS: ["sounddevice"]
# stt = ["hf-whisper", "faster-whisper"]
# g2p = ["chain"]
# phonemes = ["wav2vec2"]
# llm = ["openai-compat"]
# tts = ["kokoro", "espeak-ng"]
# triggers = ["portal", "pynput"]          # Windows/macOS: ["pynput"]

[shortcuts]
# toggle_recording = "Ctrl+Shift+Alt+R"
# practice_attempt = "Ctrl+Shift+Alt+P"
# cancel = "Ctrl+Shift+Alt+X"

# --- speech recognition -----------------------------------------------------------------

[provider.hf-whisper]
# model = "openai/whisper-large-v3-turbo"
# device = "auto"          # auto = NVIDIA/AMD GPU, then Apple GPU, then CPU; or "cpu", "cuda:1", "mps"
# language = "en"
# max_piece_s = 28.0

[provider.faster-whisper]
# model = "small.en"
# device = "cpu"           # "cuda" on NVIDIA if CUDA 12 + cuDNN 9 libraries are installed
# compute_type = "int8"    # "float16" on GPU
# beam_size = 5
# vad_filter = true

# --- pronunciation ----------------------------------------------------------------------

[provider.chain]
# order = ["cmudict", "deep-phonemizer"]   # UK English: ["misaki", "deep-phonemizer"] plus accent = "en-gb" below

[provider.misaki]
# accent = "en-us"                # or "en-gb": US or UK dictionary
# silver = true                   # also the larger, less checked dictionary

[provider.deep-phonemizer]         # predicts words no dictionary has, from their spelling
# model = "dipumiah018/deep-phonemizer-en-us"   # Hugging Face repo, or a local folder
# revision = "2ff0a505d54b995a59ad65f4c1792b293a806412"   # a fixed upload of it
# device = "cpu"

# Only with the optional espeak plugin (uv sync --extra espeak); then set the chain's order to cmudict, espeak.
[provider.espeak]
# language = "en-us"              # or "en-gb"

[provider.wav2vec2]
# model = "facebook/wav2vec2-lv-60-espeak-cv-ft"
# device = "auto"
# english_only = true

[analyzer.pronunciation]
# threshold = 0.3            # higher = stricter about what counts as a mistake
# flag_major_errors = true   # always flag a full substitution or missing sound (e.g. θ→s)
# accept_non_rhotic = true   # accept British-style r-dropping ("car" as /kɑ/)
# min_phones = 2            # shorter words aren't checked
# skip_words = ["a", "the", "of"]   # words not checked (default: about 100 short words that are reduced in speech)

[analyzer.practice]
# pass_score = 85
# different_word_score = 30

# --- grammar ----------------------------------------------------------------------------

[provider.openai-compat]
# base_url = "http://localhost:11434/v1"   # Ollama; also llama.cpp, vLLM, LM Studio, cloud APIs
# model = "qwen3:8b"                       # qwen3:14b fits in 16 GB of VRAM
# api_key_env = "OPENAI_API_KEY"           # for cloud endpoints: the NAME of the variable in .env
# temperature = 0.0                        # 0 = the same answer every time; higher = more varied
# autostart = true                         # run `ollama serve` only during analysis
# serve_command = ["ollama", "serve"]      # how to start the local server when it isn't running
# start_timeout = 60.0                     # seconds to wait for it to answer
# max_tokens = 2048                        # longest reply (some models never stop otherwise)
# timeout = 300.0                          # seconds to wait for one reply
# max_retries = 2                          # tries again after a network error
# no_think = true                          # skip Qwen3's reasoning step: faster, and not needed here
# check_model = true                       # make sure the model exists first (off for servers that name models differently)

[analyzer.grammar]
# min_confidence = 0.85   # lower = more (and less certain) grammar findings
# batch_size = 5          # sentences sent to the model at once
# retries = 1             # asks again when a reply isn't valid

# --- practice voices and audio ----------------------------------------------------------

[provider.kokoro]
# voice = "af_heart"
# speed = 0.9                # a little slower than normal helps you hear each sound
# device = "cpu"             # fast enough on the CPU, and leaves the GPU to the other models
# repo_id = "hexgrad/Kokoro-82M"   # Hugging Face repo of the voice model

[provider.espeak-ng]
# voice = "en-us"
# speed = 140

[provider.sounddevice]
# device = "Microphone name"   # see the GUI's microphone list; default = system default

[provider.pipewire]
# device = "alsa_input.usb-..."  # PipeWire node name; default = default microphone

# --- server mode (`speakcheck server serve`) ----------------------------------------------

[server]
# host = "127.0.0.1"          # 0.0.0.0 to listen on every interface (put HTTPS in front: Caddy, nginx)
# port = 8770
# data_dir = "~/.local/share/speakcheck/server"   # accounts, jobs (default: <engine data_dir>/server)
# job_ttl_hours = 24          # finished jobs (audio and result) are deleted after this
# max_upload_mb = 200
# practice_workers = 2        # practice runs on its own threads, never behind long jobs
# webhook_allow_private = false   # allow webhooks to private/local addresses

[server.limits]               # per account; `speakcheck server limits set` overrides them
# max_audio_minutes = 30
# max_jobs = 2                # waiting or running at once
# storage_mb = 2048           # synced history
# requests_per_minute = 120

# --- client mode: analyze on a speakcheck server ------------------------------------------
# Usually set by `speakcheck setup --role client` or the page's settings (which win over this file).
# This device's key is kept apart, in remote.json in the data folder.

[remote]
# mode = "local"              # "remote": analysis runs on the server below
# url = "https://speak.example.com"
# headers = { "CF-Access-Client-Id" = "${CF_ID}" }   # for a proxy; ${VAR} is read from .env
# sync = true                 # back up history to the server (default: on in remote mode)
# device_name = "my laptop"
